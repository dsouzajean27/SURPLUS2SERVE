<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FoodRescue AI - Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>🍽️ FoodRescue AI</h1>
  </header>

  <div class="container" style="max-width:440px;">
    <div class="card">
      <div class="tabs">
        <button id="tabLogin" class="active">Login</button>
        <button id="tabRegister">Register</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm">
        <label>Email</label>
        <input type="email" id="loginEmail" required />
        <label>Password</label>
        <input type="password" id="loginPassword" required />
        <button type="submit" style="margin-top:16px; width:100%;">Log In</button>
        <div id="loginMsg"></div>
      </form>

      <!-- REGISTER FORM -->
      <form id="registerForm" style="display:none;">
        <label>Role</label>
        <select id="regRole">
          <option value="donor">Donor (Restaurant / Hotel / Store)</option>
          <option value="ngo">NGO / Food Bank</option>
          <option value="admin">Admin</option>
        </select>
        <label>Full Name / Organization Name</label>
        <input type="text" id="regName" required />
        <label>Email</label>
        <input type="email" id="regEmail" required />
        <label>Password</label>
        <input type="password" id="regPassword" required />
        <label>Phone</label>
        <input type="text" id="regPhone" />
        <label>Location (Address)</label>
        <input type="text" id="regAddress" placeholder="e.g. Andheri West, Mumbai" />
        <div class="grid-2">
          <div>
            <label>Latitude</label>
            <input type="number" step="any" id="regLat" placeholder="19.1197" required />
          </div>
          <div>
            <label>Longitude</label>
            <input type="number" step="any" id="regLng" placeholder="72.8468" required />
          </div>
        </div>
        <button type="submit" style="margin-top:16px; width:100%;">Register</button>
        <div id="registerMsg"></div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
