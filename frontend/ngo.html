<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FoodRescue AI - NGO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <header class="topbar">
    <h1>🍽️ FoodRescue AI - NGO</h1>
    <div class="user-info">
      <span id="userName"></span>
      <button id="logoutBtn" class="secondary">Logout</button>
    </div>
  </header>

  <div class="container">
    <div class="grid-2">
      <div class="card">
        <h2>Post Food Requirement</h2>
        <form id="requirementForm">
          <label>Food Type (or "any")</label>
          <input type="text" id="foodType" placeholder="e.g. Cooked rice, any" required />
          <label>Required Quantity (kg)</label>
          <input type="number" id="requiredQuantity" min="1" required />
          <label>Urgency</label>
          <select id="urgency">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
          <label>Deadline</label>
          <input type="datetime-local" id="deadline" required />
          <label>Pickup/Delivery Address</label>
          <input type="text" id="address" required />
          <div class="grid-2">
            <div>
              <label>Latitude</label>
              <input type="number" step="any" id="lat" required />
            </div>
            <div>
              <label>Longitude</label>
              <input type="number" step="any" id="lng" required />
            </div>
          </div>
          <button type="submit" style="margin-top:16px; width:100%;">Post Requirement</button>
          <div id="reqMsg"></div>
        </form>
      </div>

      <div class="card">
        <h2>Location Preview</h2>
        <div id="map"></div>
      </div>
    </div>

    <div class="card">
      <h2>My Requirements</h2>
      <table>
        <thead><tr><th>Food</th><th>Qty (kg)</th><th>Urgency</th><th>Deadline</th><th></th></tr></thead>
        <tbody id="reqTableBody"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>My Accepted Donations</h2>
      <table>
        <thead><tr><th>Food</th><th>Qty (kg)</th><th>Status</th><th>Expiry</th><th></th></tr></thead>
        <tbody id="acceptedTableBody"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>Nearby Available Donations</h2>
      <label>Search radius (km)</label>
      <input type="number" id="radiusInput" value="25" style="max-width:150px;" />
      <table>
        <thead><tr><th>Food</th><th>Qty (kg)</th><th>Servings</th><th>Distance</th><th>Status</th><th>Expiry</th><th></th></tr></thead>
        <tbody id="nearbyTableBody"></tbody>
      </table>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ngo.js"></script>
</body>
</html>
