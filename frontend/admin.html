<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FoodRescue AI - Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>🍽️ FoodRescue AI - Admin</h1>
    <div class="user-info">
      <span id="userName"></span>
      <button id="logoutBtn" class="secondary">Logout</button>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <h2>Platform Stats</h2>
      <div class="stat-grid" id="statsGrid"></div>
    </div>

    <div class="card">
      <h2>Manage Users</h2>
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Verified</th><th></th></tr></thead>
        <tbody id="usersTableBody"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>Monitor Donations</h2>
      <table>
        <thead><tr><th>Food</th><th>Qty (kg)</th><th>Servings</th><th>Status</th><th>Expiry</th></tr></thead>
        <tbody id="donationsTableBody"></tbody>
      </table>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
